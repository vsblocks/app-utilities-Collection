<!DOCTYPE html>
<html lang="en">
  <head>
    <title>App-utilities Extension Collection</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta content="App-utilities Extension Collection" property="og:title">
    <meta content="https://raw.githubusercontent.com/SharkPool-SP/SharkPools-Extensions/main/pages/main-assets/au.png" property="og:image">
    <meta content="#00a6ff" data-react-helmet="true" name="theme-color">

    <!-- Import the Terser Library for Code Compression -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/terser@5.30.0/dist/bundle.min.js"></script>

    <link rel="icon" href="pages/main-assets/au.png" type="image/x-icon">
    <link href="pages/css/main.css" rel="stylesheet">
    <link href="pages/css/custom-scroller.css" rel="stylesheet">

    <!-- Lilita One Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #111111">
    <div class="navBar">
      <img class="toHost" draggable="false" src="pages/main-assets/logo-vsb.png" onclick="window.open('https://vsblocks.github.io/editor.html')">
      <div class="navHeader">
        <span class="title">App-utilities Extension Collection</span>
        <span class="header">App-utilities collection of VSblocks Extensions. Most either made by or contributed to by VSblocks and SharkPool's Extension Collection was used as a base. Hover for more Details. 
          <br><span style="color: pink">Please Load Extensions Unsandboxed, otherwise they will not Load.</span>
        </span>
      </div>
      <img class="toSP" draggable="false" src="pages/main-assets/au.png">
    </div>
    <div class="innerNav">
      <img class="navImg" id="settings" draggable="false" title="Export Settings" src="pages/main-assets/settings.svg">
      <div class="tagBar"></div>
      <img class="navImg" id="contributors" draggable="false" title="Contributor Page" src="pages/main-assets/contributors.svg">
    </div>
    <div class="innerNav">
      <img class="navImgBig" draggable="false" id="refreshTags" title="Refresh Gallery" src="pages/main-assets/refresh.svg">
    
    </div>
    <div class="filters" style="display: none">
      <!-- Bloom -->
      <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <filter id="bloom-filter">
          <feGaussianBlur in="SourceGraphic" stdDeviation="5"></feGaussianBlur>
          <feComposite in2="SourceGraphic" operator="arithmetic" k2=".3" k3="1" color-interpolation-filters="sRGB"></feComposite>
        </filter>
      </svg>
    </div>
    <script src="pages/components/tag.js" type="module"></script>
    <script src="pages/components/extension.js" type="module"></script>
    <script src="pages/components/panel-modal.js" type="module"></script>
    <script src="pages/scripts/extension-generator.js"></script>
    <script src="pages/scripts/contributor-generator.js"></script>
    <script src="pages/scripts/mobile-scaler.js"></script>
    <script src="pages/scripts/auto-extension-labeler.js" type="module"></script>
    <script src="pages/gallery-startup.js"></script>
  </body>
</html>
